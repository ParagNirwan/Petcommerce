services:
  database:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petcommerce}
      POSTGRES_DB: ${POSTGRES_DB:-petcommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
    volumes:
      - ./volumes/petcommerce/postgres:/var/lib/postgresql/data
